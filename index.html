<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlacasSteel</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#000;
  color:#fff;
}

/* BARRA SUPERIOR */
.header{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:rgba(0,0,0,0.85);
  z-index:1000;
}

.logo{
  height:45px;
}

.nav{
  display:flex;
  gap:20px;
  align-items:center;
}

.nav a, .contact-btn{
  color:white;
  text-decoration:none;
  font-weight:bold;
  background:none;
  border:none;
  font-size:16px;
}

/* HERO IMAGEN */
.hero{
  height:100vh;
  background:url("Screenshot_2026-02-16-21-06-45-160_com.openai.chatgpt-edit.jpg") no-repeat center center/cover;
  display:flex;
  align-items:center;
  padding-left:40px;
  padding-top:80px;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.hero-text{
  position:relative;
  max-width:500px;
}

.hero-text h1{
  font-size:38px;
  color:white;
}

/* BOTONERA NEGRA */
.toolbar{
  background:black;
  padding:20px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.button{
  background:black;
  color:white;
  border:1px solid white;
  padding:12px 18px;
  text-decoration:none;
  font-weight:bold;
}

/* MENÚ DESPLEGABLE CONTACTO */
.dropdown{
  position:relative;
}

.dropdown-menu{
  display:none;
  position:absolute;
  right:0;
  top:30px;
  background:black;
  border:1px solid white;
}

.dropdown-menu a{
  display:block;
  padding:10px 15px;
  color:white;
  text-decoration:none;
}

.dropdown-menu a:hover{
  background:#111;
}
</style>
</head>

<body>

<!-- BARRA SUPERIOR -->
<div class="header">
  <img src="LOGO PLACASSTEEL.png" class="logo">

  <div class="nav">
    <a href="#">Inicio</a>
    <a href="#galeria">Galería</a>
    <a href="#quienes">Quiénes somos</a>

    <div class="dropdown">
      <button class="contact-btn" onclick="toggleMenu()">Contacto ▼</button>
      <div class="dropdown-menu" id="menu">
        <a href="https://wa.me/34624745932">WhatsApp</a>
        <a href="mailto:ventas@placassteel.com">Correo</a>
      </div>
    </div>
  </div>
</div>

<!-- FOTO CENTRAL CON FRASE IZQUIERDA -->
<section class="hero">
  <div class="hero-text">
    <h1>"Que tus ideas se hagan realidad"</h1>
  </div>
</section>

<!-- BOTONES INFERIORES -->
<div class="toolbar">
  <div class="dropdown">
    <button class="button" onclick="toggleMenu()">Contacto</button>
    <div class="dropdown-menu" id="menu2">
      <a href="https://wa.me/34624745932">WhatsApp</a>
      <a href="mailto:ventas@placassteel.com">Correo</a>
    </div>
  </div>

  <a class="button" href="#fotos">Fotos</a>
  <a class="button" href="#videos">Vídeos</a>
  <a class="button" href="#diseno">Diseño</a>
</div>

<script>
function toggleMenu(){
  const menus = document.querySelectorAll('.dropdown-menu');
  menus.forEach(menu=>{
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  });
}
</script>

</body>
</html>
